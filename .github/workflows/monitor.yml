name: Independent security health

'on':
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: Synthetic TEST alert, or a normal production check
        required: true
        type: choice
        default: none
        options:
          - none
          - failure
          - recovery

permissions:
  contents: read
  issues: write

concurrency:
  group: security-health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      HEALTH_URL: ${{ secrets.HEALTH_URL }}
      ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
      ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      TEST_MODE: ${{ inputs.test_mode || 'none' }}
      PRODUCTION_STATE_ISSUE_ID: ${{ vars.PRODUCTION_STATE_ISSUE_ID }}
      TEST_STATE_ISSUE_ID: ${{ vars.TEST_STATE_ISSUE_ID }}
    steps:
      - name: Read monitor from this exact workflow commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, signal, ssl, urllib.request
          from pathlib import Path
          try:
              repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
              assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo)
              assert re.fullmatch(r'[a-fA-F0-9]{40}', sha)
              url = 'https://api.github.com/repos/' + repo + '/contents/monitor.py?ref=' + sha
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args):
                      raise ValueError('redirect rejected')
              opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github.raw+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              def expired(*args):
                  raise TimeoutError()
              signal.signal(signal.SIGALRM, expired)
              signal.alarm(5)
              with opener.open(req, timeout=5) as response:
                  assert response.status == 200 and response.geturl() == url
                  data = response.read(131073)
              signal.alarm(0)
              assert len(data) <= 131072
              compile(data, 'monitor.py', 'exec')
              Path('monitor.py').write_bytes(data)
          except Exception:
              raise SystemExit('Monitor bootstrap failed. No request details were logged.')
          PY
      - name: Check health and send only a new transition
        shell: bash
        run: python3 monitor.py
