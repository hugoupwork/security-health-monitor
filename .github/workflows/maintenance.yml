name: Maintain monitor activity

'on':
  schedule:
    - cron: '19 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-health-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Read maintenance code from this exact workflow commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, signal, ssl, urllib.request
          from pathlib import Path
          try:
              repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
              assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo)
              assert re.fullmatch(r'[a-fA-F0-9]{40}', sha)
              for filename in ('monitor.py', 'maintain.py'):
                  url = 'https://api.github.com/repos/' + repo + '/contents/' + filename + '?ref=' + sha
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, *args):
                          raise ValueError('redirect rejected')
                  opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context()))
                  req = urllib.request.Request(url, headers={
                      'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                      'Accept': 'application/vnd.github.raw+json',
                      'X-GitHub-Api-Version': '2022-11-28'})
                  def expired(*args):
                      raise TimeoutError()
                  signal.signal(signal.SIGALRM, expired)
                  signal.alarm(5)
                  with opener.open(req, timeout=5) as response:
                      assert response.status == 200 and response.geturl() == url
                      data = response.read(131073)
                  signal.alarm(0)
                  assert len(data) <= 131072
                  compile(data, filename, 'exec')
                  Path(filename).write_bytes(data)
          except Exception:
              raise SystemExit('Monitor bootstrap failed. No request details were logged.')
          PY
      - name: Record this month once
        shell: bash
        run: python3 maintain.py
